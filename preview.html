<body>
<iframe sandbox="allow-scripts" referrerpolicy="no-referrer" title="Simucella Homepage Preview" srcdoc="&lt;div id=&quot;drughiter-home-sketch&quot;&gt;
  &lt;style&gt;
    #drughiter-home-sketch {
      color-scheme: light dark;
      --dh-page: light-dark(#f6f8f7, #07100d);
      --dh-surface: light-dark(#ffffff, #0d1814);
      --dh-surface-strong: light-dark(#10271f, #dff7ec);
      --dh-ink: light-dark(#0c1a15, #f2f8f5);
      --dh-ink-on-strong: light-dark(#f4fbf7, #0b1913);
      --dh-muted: light-dark(#56665f, #a4b7ae);
      --dh-line: light-dark(#d3ddd8, #293a33);
      --dh-green: light-dark(#0d7757, #61d4a5);
      --dh-green-soft: light-dark(#dcefe6, #123b2d);
      --dh-blue: light-dark(#2355b8, #91b5ff);
      --dh-blue-soft: light-dark(#e4ecff, #172b55);
      --dh-amber: light-dark(#8c5c00, #f2bf58);
      --dh-amber-soft: light-dark(#fff0c9, #453311);
      --dh-red: light-dark(#aa3b3b, #ff9999);
      --dh-shadow: light-dark(rgba(20, 55, 42, 0.09), rgba(0, 0, 0, 0.30));
      width: 100%;
      overflow: hidden;
      background: var(--dh-page);
      color: var(--dh-ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;
      letter-spacing: 0;
    }

    #drughiter-home-sketch * { box-sizing: border-box; }
    #drughiter-home-sketch a { color: inherit; text-decoration: none; }
    #drughiter-home-sketch button { font: inherit; }
    #drughiter-home-sketch .dh-shell { width: min(100% - 40px, 1080px); margin: 0 auto; }

    #drughiter-home-sketch .dh-announcement {
      background: var(--dh-surface-strong);
      color: var(--dh-ink-on-strong);
      border-bottom: 1px solid var(--dh-line);
    }
    #drughiter-home-sketch .dh-announcement-inner {
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 7px 16px;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
    }
    #drughiter-home-sketch .dh-announcement-label {
      color: var(--dh-green);
      background: var(--dh-green-soft);
      border-radius: 999px;
      padding: 2px 7px;
      white-space: nowrap;
    }

    #drughiter-home-sketch .dh-nav {
      background: color-mix(in srgb, var(--dh-page) 92%, transparent);
      border-bottom: 1px solid var(--dh-line);
    }
    #drughiter-home-sketch .dh-nav-inner {
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    #drughiter-home-sketch .dh-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    #drughiter-home-sketch .dh-mark {
      width: 31px;
      height: 31px;
      display: grid;
      place-items: center;
      background: var(--dh-green);
      color: var(--dh-page);
      border-radius: 6px;
      font-weight: 700;
    }
    #drughiter-home-sketch .dh-brand strong { font-size: 17px; font-weight: 500; }
    #drughiter-home-sketch .dh-brand span { color: var(--dh-muted); font-size: 11px; display: block; }
    #drughiter-home-sketch .dh-nav-links { display: flex; align-items: center; gap: 18px; color: var(--dh-muted); font-size: 13px; }
    #drughiter-home-sketch .dh-nav-links a { white-space: nowrap; }
    #drughiter-home-sketch .dh-nav-links a:hover { color: var(--dh-green); }
    #drughiter-home-sketch .dh-nav-github {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--dh-line);
      background: var(--dh-surface);
      color: var(--dh-ink) !important;
      border-radius: 6px;
      padding: 7px 10px;
    }

    #drughiter-home-sketch .dh-hero {
      background: var(--dh-page);
      border-bottom: 1px solid var(--dh-line);
      padding: 70px 0 38px;
    }
    #drughiter-home-sketch .dh-hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(310px, .95fr);
      gap: 58px;
      align-items: center;
    }
    #drughiter-home-sketch .dh-eyebrow,
    #drughiter-home-sketch .dh-section-kicker {
      color: var(--dh-green);
      text-transform: uppercase;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .12em;
    }
    #drughiter-home-sketch .dh-hero h1 {
      max-width: 720px;
      margin: 14px 0 20px;
      font-size: clamp(42px, 7.2vw, 73px);
      line-height: 1.02;
      font-weight: 500;
      letter-spacing: 0;
    }
    #drughiter-home-sketch .dh-hero h1 span { color: var(--dh-green); }
    #drughiter-home-sketch .dh-hero-copy &gt; p {
      max-width: 610px;
      color: var(--dh-muted);
      font-size: 17px;
      line-height: 1.7;
      margin: 0;
    }
    #drughiter-home-sketch .dh-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
    #drughiter-home-sketch .dh-action {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 15px;
      border-radius: 6px;
      border: 1px solid var(--dh-line);
      background: var(--dh-surface);
      color: var(--dh-ink);
      font-size: 14px;
      font-weight: 500;
    }
    #drughiter-home-sketch .dh-action-primary { background: var(--dh-green); color: var(--dh-page); border-color: var(--dh-green); }

    #drughiter-home-sketch .dh-hero-visual {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }
    #drughiter-home-sketch .dh-hero-visual img {
      width: 100%;
      aspect-ratio: 3 / 2;
      display: block;
      object-fit: cover;
      object-position: center;
      border: 1px solid var(--dh-line);
      border-radius: 6px;
      background: var(--dh-page);
      box-shadow: 0 14px 32px var(--dh-shadow);
    }

    #drughiter-home-sketch .dh-section { padding: 68px 0; border-bottom: 1px solid var(--dh-line); }
    #drughiter-home-sketch .dh-section-head { display: grid; grid-template-columns: .75fr 1.25fr; gap: 50px; margin-bottom: 34px; }
    #drughiter-home-sketch .dh-section-head h2 {
      margin: 0;
      max-width: 650px;
      font-size: clamp(28px, 4.4vw, 43px);
      line-height: 1.13;
      font-weight: 500;
    }
    #drughiter-home-sketch .dh-section-head p { margin: 0; color: var(--dh-muted); line-height: 1.7; }

    #drughiter-home-sketch .dh-program-list { border-top: 1px solid var(--dh-line); }
    #drughiter-home-sketch .dh-program-item {
      display: grid;
      grid-template-columns: 62px minmax(180px, .8fr) minmax(220px, 1.5fr) 112px;
      gap: 22px;
      align-items: start;
      padding: 23px 0;
      border-bottom: 1px solid var(--dh-line);
    }
    #drughiter-home-sketch .dh-program-num { color: var(--dh-green); font-size: 12px; letter-spacing: .1em; }
    #drughiter-home-sketch .dh-program-item h3 { margin: 0; font-size: 17px; font-weight: 500; }
    #drughiter-home-sketch .dh-program-item p { margin: 0; color: var(--dh-muted); font-size: 14px; line-height: 1.6; }
    #drughiter-home-sketch .dh-status {
      justify-self: end;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
    }
    #drughiter-home-sketch .dh-status-active { color: var(--dh-green); background: var(--dh-green-soft); }
    #drughiter-home-sketch .dh-status-prep { color: var(--dh-blue); background: var(--dh-blue-soft); }
    #drughiter-home-sketch .dh-status-planned { color: var(--dh-amber); background: var(--dh-amber-soft); }

    #drughiter-home-sketch .dh-featured {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(280px, .92fr);
      gap: 0;
      border: 1px solid var(--dh-line);
      border-radius: 8px;
      overflow: hidden;
      background: var(--dh-surface);
      box-shadow: 0 16px 38px var(--dh-shadow);
    }
    #drughiter-home-sketch .dh-featured-copy { padding: 34px; }
    #drughiter-home-sketch .dh-featured-top { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
    #drughiter-home-sketch .dh-featured-type { color: var(--dh-blue); font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .1em; }
    #drughiter-home-sketch .dh-featured h3 { margin: 16px 0 12px; font-size: 29px; line-height: 1.18; font-weight: 500; }
    #drughiter-home-sketch .dh-featured-copy &gt; p { color: var(--dh-muted); line-height: 1.7; margin: 0; }
    #drughiter-home-sketch .dh-project-facts {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      border-top: 1px solid var(--dh-line);
      border-bottom: 1px solid var(--dh-line);
      margin: 25px 0 24px;
    }
    #drughiter-home-sketch .dh-project-fact { padding: 14px 12px; border-left: 1px solid var(--dh-line); }
    #drughiter-home-sketch .dh-project-fact:first-child { border-left: 0; padding-left: 0; }
    #drughiter-home-sketch .dh-project-fact strong { display: block; color: var(--dh-green); font-size: 18px; font-weight: 500; }
    #drughiter-home-sketch .dh-project-fact span { color: var(--dh-muted); font-size: 11px; }
    #drughiter-home-sketch .dh-evidence {
      margin: 0 0 24px;
      padding: 15px 17px 16px;
      border-left: 3px solid var(--dh-green);
      background: var(--dh-green-soft);
    }
    #drughiter-home-sketch .dh-evidence-label {
      display: block;
      margin-bottom: 7px;
      color: var(--dh-green);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .11em;
      text-transform: uppercase;
    }
    #drughiter-home-sketch .dh-evidence p { margin: 0; color: var(--dh-ink); font-size: 13px; line-height: 1.6; }
    #drughiter-home-sketch .dh-evidence-meta { display: flex; flex-wrap: wrap; gap: 7px 14px; margin-top: 9px; color: var(--dh-muted); font-size: 11px; }
    #drughiter-home-sketch .dh-featured-media {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: light-dark(#edf3f0, #0a1410);
      border-left: 1px solid var(--dh-line);
      padding: 22px;
    }
    #drughiter-home-sketch .dh-featured-media img {
      width: 100%;
      display: block;
      background: light-dark(#ffffff, #ffffff);
      border: 1px solid var(--dh-line);
      border-radius: 4px;
    }
    #drughiter-home-sketch .dh-featured-media figcaption { margin-top: 10px; color: var(--dh-muted); font-size: 11px; }

    #drughiter-home-sketch .dh-publication {
      display: grid;
      grid-template-columns: 76px 1fr auto;
      gap: 24px;
      align-items: start;
      padding: 25px 0;
      border-top: 1px solid var(--dh-line);
      border-bottom: 1px solid var(--dh-line);
    }
    #drughiter-home-sketch .dh-pub-year { color: var(--dh-green); font-size: 14px; font-weight: 500; }
    #drughiter-home-sketch .dh-publication h3 { margin: 0 0 8px; font-size: 19px; font-weight: 500; line-height: 1.35; }
    #drughiter-home-sketch .dh-publication p { margin: 0; color: var(--dh-muted); font-size: 13px; line-height: 1.6; }
    #drughiter-home-sketch .dh-pub-actions { display: flex; align-items: center; gap: 10px; color: var(--dh-blue); font-size: 13px; white-space: nowrap; }

    #drughiter-home-sketch .dh-roadmap-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 36px; }
    #drughiter-home-sketch .dh-roadmap-line { border-left: 1px solid var(--dh-line); padding-left: 24px; }
    #drughiter-home-sketch .dh-roadmap-entry { position: relative; padding: 0 0 25px; }
    #drughiter-home-sketch .dh-roadmap-entry:last-child { padding-bottom: 0; }
    #drughiter-home-sketch .dh-roadmap-entry::before {
      content: &quot;&quot;;
      position: absolute;
      width: 9px;
      height: 9px;
      left: -29px;
      top: 5px;
      border-radius: 50%;
      background: var(--dh-page);
      border: 2px solid var(--dh-green);
    }
    #drughiter-home-sketch .dh-roadmap-entry span { color: var(--dh-green); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; }
    #drughiter-home-sketch .dh-roadmap-entry h3 { margin: 5px 0 6px; font-size: 16px; font-weight: 500; }
    #drughiter-home-sketch .dh-roadmap-entry p { margin: 0; color: var(--dh-muted); font-size: 13px; line-height: 1.55; }
    #drughiter-home-sketch .dh-maintenance {
      border-top: 1px solid var(--dh-line);
    }
    #drughiter-home-sketch .dh-maintenance-row {
      display: grid;
      grid-template-columns: 36px 1fr;
      gap: 14px;
      padding: 17px 0;
      border-bottom: 1px solid var(--dh-line);
    }
    #drughiter-home-sketch .dh-maintenance-icon {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      color: var(--dh-green);
      border: 1px solid var(--dh-line);
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
    }
    #drughiter-home-sketch .dh-maintenance-row strong { display: block; font-size: 14px; font-weight: 500; }
    #drughiter-home-sketch .dh-maintenance-row &gt; div span { color: var(--dh-muted); font-size: 12px; }

    #drughiter-home-sketch .dh-partners { padding: 38px 0; border-bottom: 1px solid var(--dh-line); }
    #drughiter-home-sketch .dh-partners-inner { display: flex; align-items: center; justify-content: space-between; gap: 26px; }
    #drughiter-home-sketch .dh-partners p { color: var(--dh-muted); font-size: 12px; text-transform: uppercase; letter-spacing: .1em; }
    #drughiter-home-sketch .dh-partner-names { display: flex; align-items: center; gap: 32px; font-size: 18px; font-weight: 500; }
    #drughiter-home-sketch .dh-partner-names span { color: var(--dh-muted); font-weight: 400; }

    #drughiter-home-sketch .dh-cta { background: var(--dh-surface-strong); color: var(--dh-ink-on-strong); padding: 58px 0; }
    #drughiter-home-sketch .dh-cta-inner { display: flex; align-items: center; justify-content: space-between; gap: 34px; }
    #drughiter-home-sketch .dh-cta h2 { margin: 0 0 8px; font-size: clamp(28px, 4vw, 40px); font-weight: 500; }
    #drughiter-home-sketch .dh-cta p { margin: 0; color: color-mix(in srgb, var(--dh-ink-on-strong) 72%, transparent); }
    #drughiter-home-sketch .dh-cta .dh-action { background: transparent; color: var(--dh-ink-on-strong); border-color: color-mix(in srgb, var(--dh-ink-on-strong) 36%, transparent); }
    #drughiter-home-sketch .dh-cta .dh-action-primary { background: var(--dh-green); border-color: var(--dh-green); color: var(--dh-page); }

    #drughiter-home-sketch .dh-footer { padding: 28px 0 42px; background: var(--dh-surface-strong); color: var(--dh-ink-on-strong); }
    #drughiter-home-sketch .dh-footer-inner { display: flex; justify-content: space-between; gap: 26px; padding-top: 24px; border-top: 1px solid color-mix(in srgb, var(--dh-ink-on-strong) 20%, transparent); }
    #drughiter-home-sketch .dh-footer small { color: color-mix(in srgb, var(--dh-ink-on-strong) 60%, transparent); }
    #drughiter-home-sketch .dh-footer-links { display: flex; gap: 18px; font-size: 12px; }

    @media (max-width: 820px) {
      #drughiter-home-sketch .dh-nav-links a:not(.dh-nav-github) { display: none; }
      #drughiter-home-sketch .dh-hero-grid,
      #drughiter-home-sketch .dh-featured { grid-template-columns: 1fr; }
      #drughiter-home-sketch .dh-hero { padding-top: 52px; }
      #drughiter-home-sketch .dh-hero-visual { width: min(100%, 500px); margin-top: 14px; }
      #drughiter-home-sketch .dh-featured-media { border-left: 0; border-top: 1px solid var(--dh-line); }
      #drughiter-home-sketch .dh-program-item { grid-template-columns: 42px minmax(150px, .7fr) 1.3fr; }
      #drughiter-home-sketch .dh-program-item .dh-status { grid-column: 2 / 4; justify-self: start; }
    }

    @media (max-width: 560px) {
      #drughiter-home-sketch .dh-shell { width: min(100% - 28px, 1080px); }
      #drughiter-home-sketch .dh-brand span { display: none; }
      #drughiter-home-sketch .dh-hero h1 { font-size: 43px; }
      #drughiter-home-sketch .dh-hero-copy &gt; p { font-size: 15px; }
      #drughiter-home-sketch .dh-hero-visual { width: 100%; }
      #drughiter-home-sketch .dh-section { padding: 52px 0; }
      #drughiter-home-sketch .dh-section-head { grid-template-columns: 1fr; gap: 12px; }
      #drughiter-home-sketch .dh-program-item { grid-template-columns: 36px 1fr; gap: 10px; }
      #drughiter-home-sketch .dh-program-item p,
      #drughiter-home-sketch .dh-program-item .dh-status { grid-column: 2; }
      #drughiter-home-sketch .dh-project-facts { grid-template-columns: 1fr 1fr; }
      #drughiter-home-sketch .dh-project-fact:nth-child(odd) { border-left: 0; padding-left: 0; }
      #drughiter-home-sketch .dh-project-fact:nth-child(n+3) { border-top: 1px solid var(--dh-line); }
      #drughiter-home-sketch .dh-featured-copy { padding: 24px; }
      #drughiter-home-sketch .dh-publication { grid-template-columns: 1fr; gap: 10px; }
      #drughiter-home-sketch .dh-roadmap-grid { grid-template-columns: 1fr; }
      #drughiter-home-sketch .dh-partners-inner,
      #drughiter-home-sketch .dh-cta-inner,
      #drughiter-home-sketch .dh-footer-inner { align-items: flex-start; flex-direction: column; }
      #drughiter-home-sketch .dh-partner-names { flex-wrap: wrap; gap: 14px; }
      #drughiter-home-sketch .dh-footer-links { flex-wrap: wrap; }
    }
  &lt;/style&gt;

  &lt;div class=&quot;dh-announcement&quot;&gt;
    &lt;div class=&quot;dh-announcement-inner&quot;&gt;
      &lt;span class=&quot;dh-announcement-label&quot;&gt;First benchmark&lt;/span&gt;
      &lt;span&gt;scDrugPerturb-Bench introduces mechanism-aware evaluation for single-cell drug response prediction&lt;/span&gt;
      &lt;span aria-hidden=&quot;true&quot;&gt;&amp;rarr;&lt;/span&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;nav class=&quot;dh-nav&quot; aria-label=&quot;Primary navigation&quot;&gt;
    &lt;div class=&quot;dh-shell dh-nav-inner&quot;&gt;
      &lt;a class=&quot;dh-brand&quot; href=&quot;#dh-home&quot;&gt;
        &lt;span class=&quot;dh-mark&quot; aria-hidden=&quot;true&quot;&gt;D&lt;/span&gt;
        &lt;span&gt;&lt;strong&gt;Simucella&lt;/strong&gt;&lt;/span&gt;
      &lt;/a&gt;
      &lt;div class=&quot;dh-nav-links&quot;&gt;
        &lt;a href=&quot;#dh-program&quot;&gt;Program&lt;/a&gt;
        &lt;a href=&quot;#dh-projects&quot;&gt;Projects&lt;/a&gt;
        &lt;a href=&quot;#dh-publications&quot;&gt;Publications&lt;/a&gt;
        &lt;a href=&quot;#dh-roadmap&quot;&gt;Releases&lt;/a&gt;
        &lt;a class=&quot;dh-nav-github&quot; href=&quot;#dh-open-source&quot;&gt;GitHub &lt;span aria-hidden=&quot;true&quot;&gt;&amp;nearr;&lt;/span&gt;&lt;/a&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/nav&gt;

  &lt;main id=&quot;dh-home&quot;&gt;
    &lt;section class=&quot;dh-hero&quot;&gt;
      &lt;div class=&quot;dh-shell&quot;&gt;
        &lt;div class=&quot;dh-hero-grid&quot;&gt;
          &lt;div class=&quot;dh-hero-copy&quot;&gt;
            &lt;div class=&quot;dh-eyebrow&quot;&gt;AI for Biology&lt;/div&gt;
            &lt;h1&gt;Build the &lt;span&gt;Virtual Cell&lt;/span&gt;&lt;/h1&gt;
            &lt;p&gt;Simucella develops open perturbation datasets, predictive models and multi-omics systems for understanding cellular response and advancing AI-driven drug discovery.&lt;/p&gt;
            &lt;div class=&quot;dh-actions&quot;&gt;
              &lt;a class=&quot;dh-action dh-action-primary&quot; href=&quot;#dh-program&quot;&gt;Explore our program &lt;span aria-hidden=&quot;true&quot;&gt;&amp;rarr;&lt;/span&gt;&lt;/a&gt;
              &lt;a class=&quot;dh-action&quot; href=&quot;#dh-projects&quot;&gt;scDrugPerturb-Bench&lt;/a&gt;
              &lt;a class=&quot;dh-action&quot; href=&quot;#dh-publications&quot;&gt;Publication&lt;/a&gt;
            &lt;/div&gt;

    &lt;section class=&quot;dh-section&quot; id=&quot;dh-program&quot;&gt;
      &lt;div class=&quot;dh-shell&quot;&gt;
        &lt;div class=&quot;dh-section-head&quot;&gt;
          &lt;div class=&quot;dh-section-kicker&quot;&gt;Research program&lt;/div&gt;
          &lt;div&gt;
            &lt;h2&gt;One program, five connected capabilities.&lt;/h2&gt;
            &lt;p&gt;Our long-term goal is a computable cell that can predict how biological systems respond to interventions, connect molecular mechanisms to phenotypes and support therapeutic discovery.&lt;/p&gt;
          &lt;/div&gt;
        &lt;/div&gt;

        &lt;div class=&quot;dh-program-list&quot;&gt;
          &lt;article class=&quot;dh-program-item&quot;&gt;
            &lt;div class=&quot;dh-program-num&quot;&gt;01&lt;/div&gt;
            &lt;h3&gt;Perturbation datasets&lt;/h3&gt;
            &lt;p&gt;Versioned drug- and gene-perturbation datasets with biological context, provenance, evidence and reproducible splits.&lt;/p&gt;
            &lt;span class=&quot;dh-status dh-status-active&quot;&gt;Active&lt;/span&gt;
          &lt;/article&gt;
          &lt;article class=&quot;dh-program-item&quot;&gt;
            &lt;div class=&quot;dh-program-num&quot;&gt;02&lt;/div&gt;
            &lt;h3&gt;Drug perturbation models&lt;/h3&gt;
            &lt;p&gt;Mechanism-aware models for predicting cellular response across compounds, doses, cell states and experimental systems.&lt;/p&gt;
            &lt;span class=&quot;dh-status dh-status-prep&quot;&gt;In preparation&lt;/span&gt;
          &lt;/article&gt;
          &lt;article class=&quot;dh-program-item&quot;&gt;
            &lt;div class=&quot;dh-program-num&quot;&gt;03&lt;/div&gt;
            &lt;h3&gt;Gene perturbation models&lt;/h3&gt;
            &lt;p&gt;Models of causal gene programs and genetic interventions that complement compound-level perturbation learning.&lt;/p&gt;
            &lt;span class=&quot;dh-status dh-status-planned&quot;&gt;Planned&lt;/span&gt;
          &lt;/article&gt;
          &lt;article class=&quot;dh-program-item&quot;&gt;
            &lt;div class=&quot;dh-program-num&quot;&gt;04&lt;/div&gt;
            &lt;h3&gt;Virtual cells&lt;/h3&gt;
            &lt;p&gt;Foundation and multi-omics models that represent cell state, forecast transitions and simulate intervention responses.&lt;/p&gt;
            &lt;span class=&quot;dh-status dh-status-planned&quot;&gt;Long-term&lt;/span&gt;
          &lt;/article&gt;
          &lt;article class=&quot;dh-program-item&quot;&gt;
            &lt;div class=&quot;dh-program-num&quot;&gt;05&lt;/div&gt;
            &lt;h3&gt;AI-driven drug discovery&lt;/h3&gt;
            &lt;p&gt;Evaluation tasks and models for compound retrieval, target discovery, response prediction and therapeutic development.&lt;/p&gt;
            &lt;span class=&quot;dh-status dh-status-planned&quot;&gt;Long-term&lt;/span&gt;
          &lt;/article&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;dh-section&quot; id=&quot;dh-projects&quot;&gt;
      &lt;div class=&quot;dh-shell&quot;&gt;
        &lt;div class=&quot;dh-section-head&quot;&gt;
          &lt;div class=&quot;dh-section-kicker&quot;&gt;Featured project&lt;/div&gt;
          &lt;div&gt;&lt;h2&gt;Start with mechanisms, not reconstruction alone.&lt;/h2&gt;&lt;/div&gt;
        &lt;/div&gt;

        &lt;article class=&quot;dh-featured&quot;&gt;
          &lt;div class=&quot;dh-featured-copy&quot;&gt;
            &lt;div class=&quot;dh-featured-top&quot;&gt;
              &lt;span class=&quot;dh-featured-type&quot;&gt;Benchmark&lt;/span&gt;
              &lt;span class=&quot;dh-status dh-status-active&quot;&gt;Active development&lt;/span&gt;
            &lt;/div&gt;
            &lt;h3&gt;scDrugPerturb-Bench&lt;/h3&gt;
            &lt;p&gt;Unlike benchmarks built only from expression matrices, scDrugPerturb-Bench links each evaluation case to a biological conclusion extracted from its source paper. It tests whether a model recovers the direction, magnitude and specificity of drug response beyond expression similarity.&lt;/p&gt;
            &lt;div class=&quot;dh-project-facts&quot;&gt;
              &lt;div class=&quot;dh-project-fact&quot;&gt;&lt;strong&gt;2.5M&lt;/strong&gt;&lt;span&gt;single cells&lt;/span&gt;&lt;/div&gt;
              &lt;div class=&quot;dh-project-fact&quot;&gt;&lt;strong&gt;181&lt;/strong&gt;&lt;span&gt;datasets&lt;/span&gt;&lt;/div&gt;
              &lt;div class=&quot;dh-project-fact&quot;&gt;&lt;strong&gt;101&lt;/strong&gt;&lt;span&gt;drugs&lt;/span&gt;&lt;/div&gt;
              &lt;div class=&quot;dh-project-fact&quot;&gt;&lt;strong&gt;4,500&lt;/strong&gt;&lt;span&gt;model evaluations&lt;/span&gt;&lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;dh-evidence&quot;&gt;
              &lt;span class=&quot;dh-evidence-label&quot;&gt;Literature-grounded test case&lt;/span&gt;
              &lt;p&gt;In HUES8 pancreatic progenitors, &lt;strong&gt;0.5 &amp;micro;M latrunculin A for 5 days upregulates NEUROG3&lt;/strong&gt; versus untreated cells.&lt;/p&gt;
              &lt;div class=&quot;dh-evidence-meta&quot;&gt;&lt;span&gt;Benchmark 32094658_01&lt;/span&gt;&lt;span&gt;GSE137659&lt;/span&gt;&lt;span&gt;1,728 cells (686 control + 1,042 treated)&lt;/span&gt;&lt;/div&gt;
            &lt;/div&gt;
